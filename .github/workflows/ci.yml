name: Basic CI Pipeline

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API's Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./flask_microservice_for_API
          file: ./flask_microservice_for_API/Dockerfile.flask
          push: false 
          tags: |
            flask_service:latest
            flask_service:${{ github.sha }}

      - name: Build app's Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./the_app
          file: ./the_app/Dockerfile.app 
          push: false 
          tags: |
            UI_app:latest
            UI_app:${{ github.sha }}
  
  integration-test:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - uses: actions/checkout@v4

      - name: Build with Compose
        run: docker compose build

      - name: Start services
        run: docker compose up -d
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}

      - name: Wait for services
        run: sleep 10

      # - name: Run integration test
      #   run: e.g. curl --fail http://localhost:5000/health

      - name: Shut down
        run: docker compose down